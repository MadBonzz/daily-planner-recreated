name: Paired Bonsai component evaluation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/component-evaluation.yml']
permissions:
  contents: read
concurrency:
  group: paired-bonsai-evaluation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Evaluate Bonsai ${{ matrix.tag }} on CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: 4b
            model: ternary-bonsai-4b
            repo: prism-ml/Ternary-Bonsai-4B-gguf
            revision: a3eb42bafe873f9686bc97486c43b72ef7d75ec8
            file: Ternary-Bonsai-4B-Q2_0_g64.gguf
          - tag: 9b
            model: ternary-bonsai-2-9b
            repo: prism-ml/Ternary-Bonsai-2-9B-gguf
            revision: 82265ccc78ddaac4700286a35e9badcc32376dd9
            file: Ternary-Bonsai-2-9B-Q2_0.gguf
    env:
      TAG: ${{ matrix.tag }}
      MODEL_REPO: ${{ matrix.repo }}
      MODEL_FILE: ${{ matrix.file }}
      REVISION: ${{ matrix.revision }}
      PLANNER_MODEL: ${{ matrix.model }}
      PLANNER_MODEL_ENDPOINT: http://127.0.0.1:1234/v1/chat/completions
      PLANNER_MODEL_TIMEOUT_SECONDS: '600'
    steps:
      - uses: actions/checkout@v4
      - name: Clear previous receipts from the disposable checkout
        run: |
          rm -rf "data/results/component-scale/pause/runs/$TAG" "data/results/component-scale/matrix/forecast-$TAG-boards" "data/results/component-scale/matrix/forecast-$TAG.json"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install the planner and headless LM Studio
        timeout-minutes: 10
        run: |
          python -m pip install -r requirements.txt
          curl -fsSL --retry 3 https://lmstudio.ai/install.sh -o "$RUNNER_TEMP/install.sh"
          bash "$RUNNER_TEMP/install.sh" --no-modify-path
          echo "$HOME/.lmstudio/bin" >> "$GITHUB_PATH"
      - name: Start the CPU runtime
        timeout-minutes: 10
        run: |
          lms daemon up --json
          lms runtime get llama.cpp --yes
          lms runtime ls
      - name: Load the pinned model
        timeout-minutes: 20
        run: |
          curl -fL --retry 3 --connect-timeout 20 --speed-time 60 --speed-limit 1024 \
            "https://huggingface.co/$MODEL_REPO/resolve/$REVISION/$MODEL_FILE" -o "$RUNNER_TEMP/$MODEL_FILE"
          lms import "$RUNNER_TEMP/$MODEL_FILE" --user-repo "$MODEL_REPO" --hard-link --yes
          lms load "$PLANNER_MODEL" --identifier "$PLANNER_MODEL" --context-length 8192 --gpu off --yes
          lms server start --bind 127.0.0.1 --port 1234
          lms ps
          python -m examples.estimation.check_local_models --component forecast
      - name: Evaluate the 48 workspace pauses
        run: |
          python -m examples.estimation.scale_pause run "$TAG" --workers 1
          python -m examples.estimation.scale_pause score "$TAG"
      - name: Replay the 16 active-task boards
        run: |
          python -m examples.estimation.scale_matrix forecast --model-tag "$TAG" --workers 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-evaluation-${{ matrix.tag }}
          path: |
            data/results/component-scale/pause/runs/${{ matrix.tag }}
            data/results/component-scale/matrix/forecast-${{ matrix.tag }}.json
            data/results/component-scale/matrix/forecast-${{ matrix.tag }}-boards
          if-no-files-found: ignore
