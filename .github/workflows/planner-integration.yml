name: Planner integration
on:
  push:
    paths-ignore:
      - 'data/results/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'data/results/**'
      - '**/*.md'
permissions:
  contents: read
jobs:
  planner-scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: node --test tests/browser_rules.test.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser/extension_smoke.py
      - run: python tests/browser/workspace_smoke.py

  windows-planner:
    runs-on: windows-latest
    timeout-minutes: 18
    env:
      PLANNER_TEST_WINDOWS_SCHEDULER: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m pip install playwright
      - run: python -m playwright install chromium
      - run: python tests/browser/workspace_smoke.py
