name: Mac setup and Dev smoke
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'data/results/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'data/results/**'
      - '**/*.md'
permissions:
  contents: read
jobs:
  setup-and-demo:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install in a new virtual environment
        run: |
          sw_vers
          uname -m
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.txt pytest
          .venv/bin/python -m pip check
      - name: Start the normal Streamlit server
        shell: bash
        run: |
          export PLANNER_DATA_DIR="$RUNNER_TEMP/planner-mac-smoke"
          .venv/bin/python -m streamlit run app.py --server.address 127.0.0.1 --server.port 8501 --server.headless true > "$RUNNER_TEMP/streamlit.log" 2>&1 &
          planner_pid=$!
          trap 'kill "$planner_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health 2>/dev/null | grep -qx ok; then exit 0; fi
            sleep 1
          done
          cat "$RUNNER_TEMP/streamlit.log"
          exit 1
      - name: Browse Dev histories and verify the model-free local stages
        run: |
          .venv/bin/python -m pytest -q tests/test_demo_picker.py tests/test_activity_db.py "tests/test_packaged_dev_schedule.py::test_packaged_replay_and_editable_samples_need_only_the_forecast_provider[d1-systems-student]"
      - name: Open the PDF workspace and pause it in Chromium
        if: matrix.os == 'macos-15'
        timeout-minutes: 7
        run: |
          .venv/bin/python -m pip install playwright
          .venv/bin/python -m playwright install chromium
          .venv/bin/python tests/browser/workspace_smoke.py
