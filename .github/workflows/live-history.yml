name: Live Bonsai demo sequence
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/live-history.yml'
      - 'tests/live/test_bonsai_history.py'
      - 'estimator.py'
      - 'estimate_worker.py'
      - 'model_client.py'
      - 'chat_tasks.py'

permissions:
  contents: read

jobs:
  nora-and-chat:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLANNER_MODEL_ENDPOINT: http://127.0.0.1:18175/v1/chat/completions
      PLANNER_MODEL: ternary-bonsai-2-4b-gguf
      PLANNER_TEST_LIVE_HISTORY: '1'
      PLANNER_MODEL_TIMEOUT_SECONDS: '360'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest
      - name: Install the pinned runtime and model
        run: |
          curl -fLsS --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b12444/llama-b12444-bin-ubuntu-x64.tar.gz -o "$RUNNER_TEMP/llama.tar.gz"
          mkdir -p "$RUNNER_TEMP/llama"
          tar -xzf "$RUNNER_TEMP/llama.tar.gz" -C "$RUNNER_TEMP/llama" --strip-components=1
          curl -fLsS --retry 3 https://huggingface.co/prism-ml/Ternary-Bonsai-2-4B-gguf/resolve/50ebba61be85e5be07e8083db468ace0fc1bac43/Ternary-Bonsai-2-4B-Q2_0.gguf -o "$RUNNER_TEMP/bonsai.gguf"
      - name: Exercise the chat and estimation entry points
        run: |
          "$RUNNER_TEMP/llama/llama-server" -m "$RUNNER_TEMP/bonsai.gguf" --alias "$PLANNER_MODEL" --port 18175 -c 8192 -np 1 -t 4 --seed 42 >"$RUNNER_TEMP/server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:18175/health >/dev/null 2>&1; then break; fi
            if ! kill -0 "$server_pid" 2>/dev/null; then cat "$RUNNER_TEMP/server.log"; exit 1; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18175/health
          python -m pytest -vs tests/live/test_bonsai_history.py
