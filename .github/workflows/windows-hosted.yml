name: Windows Command R7B and hosted API
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/windows-hosted.yml', 'tests/live/test_windows_planner.py']
permissions:
  contents: read
jobs:
  check-hosted-access:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    outputs:
      available: ${{ steps.access.outputs.available }}
    steps:
      - name: Check hosted test availability
        id: access
        shell: pwsh
        env:
          COHERE_API: ${{ secrets.COHERE_API || secrets.COHERE_API_KEY }}
        run: |
          if ($env:COHERE_API) {
            "available=true" >> $env:GITHUB_OUTPUT
          } else {
            "Live Cohere inference was not tested. Set the COHERE_API repository secret and run this workflow again." >> $env:GITHUB_STEP_SUMMARY
            "available=false" >> $env:GITHUB_OUTPUT
          }
  hosted:
    needs: check-hosted-access
    if: needs.check-hosted-access.outputs.available == 'true'
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest playwright
      - run: python -m playwright install chromium
      - name: Run the browser and Nora with hosted Command R7B
        env:
          COHERE_API: ${{ secrets.COHERE_API || secrets.COHERE_API_KEY }}
          PLANNER_MODEL_ENDPOINT: https://api.cohere.ai/compatibility/v1/chat/completions
          PLANNER_MODEL: command-r7b-12-2024
          PLANNER_TEST_LIVE_HISTORY: '1'
          PLANNER_TEST_LIVE_BROWSER: '1'
        run: python -m pytest -q -s tests/live/test_windows_planner.py tests/live/test_bonsai_history.py

  windows-command-r7b:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      PLANNER_MODEL_ENDPOINT: http://127.0.0.1:18175/v1/chat/completions
      PLANNER_MODEL: command-r7b-12-2024
      PLANNER_TEST_LIVE_BROWSER: '1'
      PLANNER_TEST_LIVE_HISTORY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt pytest playwright
      - run: python -m playwright install chromium
      - name: Download the pinned Windows runtime and Command R7B weights
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          curl.exe -fLsS --retry 3 https://github.com/ggml-org/llama.cpp/releases/download/b12444/llama-b12444-bin-win-cpu-x64.zip -o "$env:RUNNER_TEMP/llama.zip"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Expand-Archive "$env:RUNNER_TEMP/llama.zip" "$env:RUNNER_TEMP/llama"
          curl.exe -fLsS --retry 3 https://huggingface.co/bartowski/c4ai-command-r7b-12-2024-GGUF/resolve/bfc7a934c45cb839d84c8ca01d87f1cfa51aaa3f/c4ai-command-r7b-12-2024-Q4_K_M.gguf -o "$env:RUNNER_TEMP/command.gguf"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Start the real API and exercise the planner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Get-ChildItem "$env:RUNNER_TEMP/llama" -Filter llama-server.exe -Recurse).FullName
          $arguments = @('-m', "$env:RUNNER_TEMP/command.gguf", '--alias', $env:PLANNER_MODEL, '--port', '18175', '-c', '8192', '-np', '1', '-t', '4', '--seed', '42')
          $server = Start-Process -FilePath $exe -ArgumentList $arguments -PassThru -RedirectStandardError "$env:RUNNER_TEMP/command-server.log"
          try {
            for ($i = 0; $i -lt 90; $i++) {
              if ($server.HasExited) { Get-Content "$env:RUNNER_TEMP/command-server.log" -Tail 25; throw 'Command R7B could not start' }
              try { Invoke-RestMethod http://127.0.0.1:18175/health -TimeoutSec 2 | Out-Null; break } catch { Start-Sleep 1 }
            }
            Invoke-RestMethod http://127.0.0.1:18175/health -TimeoutSec 3 | Out-Null
            python -m pytest -q -s tests/live/test_windows_planner.py tests/live/test_bonsai_history.py
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            if (!$server.HasExited) { Stop-Process -Id $server.Id -Force }
          }
